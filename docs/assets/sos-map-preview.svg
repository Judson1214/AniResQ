<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1000" height="60" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <circle cx="36" cy="30" r="10" fill="#10B981" />
  <text x="56" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold">AniResQ</text>
  <rect x="140" y="20" width="80" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
  <text x="180" y="35" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE SOS</text>
  <text x="760" y="35" fill="#94A3B8" font-family="sans-serif" font-size="13">Active Dispatch Radius: <tspan fill="#38BDF8" font-weight="bold">15 km</tspan></text>
  <circle cx="940" cy="30" r="14" fill="#334155" />
  <text x="940" y="35" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">JS</text>

  <!-- Map Canvas Grid -->
  <g opacity="0.15">
    <path d="M 50 120 L 680 120 M 50 200 L 680 200 M 50 280 L 680 280 M 50 360 L 680 360 M 50 440 L 680 440 M 50 520 L 680 520" stroke="#64748B" stroke-width="1" stroke-dasharray="4" />
    <path d="M 120 80 L 120 540 M 220 80 L 220 540 M 320 80 L 320 540 M 420 80 L 420 540 M 520 80 L 520 540 M 620 80 L 620 540" stroke="#64748B" stroke-width="1" stroke-dasharray="4" />
  </g>

  <!-- Simulated Roads / Map Features -->
  <path d="M 60 160 Q 220 220 380 210 T 680 240" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />
  <path d="M 280 90 Q 300 280 380 400 T 560 530" fill="none" stroke="#334155" stroke-width="5" opacity="0.6" />

  <!-- Geofence Radius Ring around Volunteer Base -->
  <circle cx="380" cy="300" r="140" fill="#10B981" fill-opacity="0.06" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4" />
  <circle cx="380" cy="300" r="7" fill="#10B981" filter="url(#glowGreen)" />
  <text x="380" y="325" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">You (Responder Base)</text>

  <!-- Incident Markers -->
  <!-- CRITICAL Incident Marker -->
  <circle cx="430" cy="230" r="16" fill="#EF4444" fill-opacity="0.3" filter="url(#glowRed)" />
  <circle cx="430" cy="230" r="9" fill="#EF4444" />
  
  <!-- Popup Card for Critical Incident -->
  <rect x="445" y="140" width="230" height="110" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
  <rect x="455" y="152" width="70" height="18" rx="4" fill="#EF4444" fill-opacity="0.2" />
  <text x="490" y="165" fill="#F87171" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CRITICAL</text>
  <text x="535" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">Dog (Trauma)</text>
  <text x="455" y="190" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="bold">MG Road Junction</text>
  <text x="455" y="208" fill="#94A3B8" font-family="sans-serif" font-size="11">Distance: <tspan fill="#F87171" font-weight="bold">2.4 km away</tspan></text>
  <rect x="455" y="218" width="100" height="22" rx="4" fill="#EF4444" />
  <text x="505" y="233" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Respond SOS</text>

  <!-- Other Incident Markers -->
  <circle cx="270" cy="350" r="8" fill="#F59E0B" />
  <text x="270" y="375" fill="#FCD34D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Puppy Rescue (HIGH)</text>

  <circle cx="560" cy="390" r="8" fill="#3B82F6" />
  <text x="560" y="415" fill="#93C5FD" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Kitten Stray (LOW)</text>

  <!-- Right Dispatch Sidebar -->
  <rect x="710" y="75" width="270" height="465" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="730" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Emergency Dispatch</text>
  <text x="730" y="130" fill="#94A3B8" font-family="sans-serif" font-size="12">3 active incidents in zone</text>

  <!-- Dispatch Item 1 -->
  <rect x="725" y="150" width="240" height="90" rx="8" fill="#0B1120" stroke="#EF4444" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="745" cy="172" r="5" fill="#EF4444" />
  <text x="758" y="176" fill="#F87171" font-family="sans-serif" font-size="12" font-weight="bold">CRITICAL - Injured Canine</text>
  <text x="745" y="196" fill="#94A3B8" font-family="sans-serif" font-size="11">Reported 4m ago • 2.4 km</text>
  <text x="745" y="222" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="bold">3 Responders Alerted</text>

  <!-- Dispatch Item 2 -->
  <rect x="725" y="250" width="240" height="90" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
  <circle cx="745" cy="272" r="5" fill="#F59E0B" />
  <text x="758" y="276" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="bold">HIGH - Abandoned Litter</text>
  <text x="745" y="296" fill="#94A3B8" font-family="sans-serif" font-size="11">Reported 22m ago • 6.8 km</text>
  <text x="745" y="322" fill="#60A5FA" font-family="sans-serif" font-size="11">Assigned: NGO Alpha</text>

  <!-- Dispatch Item 3 -->
  <rect x="725" y="350" width="240" height="80" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1" />
  <circle cx="745" cy="372" r="5" fill="#3B82F6" />
  <text x="758" y="376" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="bold">MEDIUM - Bird Trauma</text>
  <text x="745" y="396" fill="#94A3B8" font-family="sans-serif" font-size="11">Reported 1h ago • 11.2 km</text>

  <!-- Report SOS Button -->
  <rect x="725" y="470" width="240" height="42" rx="8" fill="#EF4444" />
  <text x="845" y="496" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">+ Report Emergency SOS</text>
</svg>
